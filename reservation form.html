<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bio Data Form</title>
</head>
<body>

    <h1>Login Form</h1>
    <form action="" method="post">
        <label for="Email">Email:</label>
        <input type="email" id="Email" required>
        <br><br>

        Password:
        <input type="password" id="Password" required>
        <br><br>

        <input type="submit" value="Sign In">
        <br><br>
    </form>


    <h1>Register Here</h1>
    <form action="" method="post">
        <label for="Name">Name:</label>
        <input type="text" id="Name" minlength="5" required>
        <br><br>

        Email:
        <input type="email" name="Email" required>
        <br><br>

        Phone Number:
        <input type="tel" name="phoneNumber" pattern="[0-9]{10}" required>
        <br><br>

        Choose Password:
        <input type="password" name="password" required>
        <br><br>

        <input type="submit" value="Register">
    </form>


    <h1>Registration Form</h1>
    <form action="" method="post">
        <label for="regName">Name:</label>
        <input type="text" id="regName" minlength="5" maxlength="30" required>
        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" minlength="1" maxlength="10" required>
        <br><br>

        <label for="Address">Address:</label>
        <textarea id="Address" rows="6" cols="15" required></textarea>
        <br><br>

        <label for="city">City:</label>
        <input type="text" id="city" required>
        <br><br>

        <label for="state">State:</label>
        <input type="text" id="state" required>
        <br><br>

        <label for="zipCode">Zip Code:</label>
        <input type="number" name="zipCode" min="600000" max="699999">
        <br><br>

        Phone Number:
        <input type="tel" name="phone" pattern="[0-9]{10}">
        <br><br>

        Email-Id:
        <input type="email" name="emailid">
        <br><br>

        Check-in Date:
        <input type="date" name="checkin">
        <br><br>

        Check-out Date:
        <input type="date" name="checkout">
        <br><br>

        Payment Method:
        <select id="paymentMethod" required>
            <option value="">--Select--</option>
            <option value="creditCard">Credit Card</option>
            <option value="debitCard">Debit Card</option>
            <option value="upi">UPI</option>
            <option value="cash">Cash</option>
        </select>
        <br><br>

        Card Number:
        <input type="text" id="cardNumber" maxlength="16" pattern="[0-9]{16}">
        <br><br>

        <h3>Special Request:</h3>
        <input type="text" size="90" placeholder="Enter your request here" maxlength="100" autofocus>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>

</body>
</html>
